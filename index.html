<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#17664b"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="description"
    content="یار کشاورز - دستیار کشاورزی"
  >

  <title>یار کشاورز</title>

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <link
    rel="icon"
    href="assets/icon-192.png"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Tahoma,
        Arial,
        sans-serif;
      background: #f4f7f5;
    }

    body {
      direction: rtl;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }

    .app-shell {
      min-height: 100vh;
    }

    .loading-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .loading-box {
      width: min(420px, 100%);
      padding: 30px;
      border-radius: 24px;
      background: white;
      box-shadow:
        0 10px 35px rgba(0,0,0,.08);
    }

    .loading-title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .loading-text {
      color: #66736d;
      font-size: 14px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 4px solid #dce8e2;
      border-top-color: #17664b;
      animation: yk-spin .8s linear infinite;
    }

    @keyframes yk-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%);
      z-index: 99999;
      max-width: calc(100% - 30px);
      padding: 12px 18px;
      border-radius: 14px;
      background: #173d2f;
      color: white;
      font-size: 14px;
      box-shadow:
        0 8px 25px rgba(0,0,0,.2);
      display: none;
    }

    .toast.show {
      display: block;
      animation: yk-toast .2s ease;
    }

    @keyframes yk-toast {
      from {
        opacity: 0;
        transform:
          translate(-50%, 10px);
      }

      to {
        opacity: 1;
        transform:
          translate(-50%, 0);
      }
    }

    .muted {
      color: #68766f;
    }

    .small {
      font-size: 12px;
    }

    .metric {
      font-size: 22px;
      font-weight: 800;
      margin-top: 5px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      box-shadow:
        0 5px 20px rgba(0,0,0,.05);
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .primary,
    .secondary {
      border: 0;
      border-radius: 12px;
      padding: 11px 15px;
      font-size: 14px;
      font-weight: 700;
    }

    .primary {
      background: #17664b;
      color: white;
    }

    .secondary {
      background: #eaf1ed;
      color: #174b39;
    }

    .primary:disabled,
    .secondary:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .measure-wrap {
      padding-bottom: 30px;
    }

    .measure-head {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .measure-head input {
      flex: 1;
      min-width: 0;
      border: 1px solid #d8e2dc;
      border-radius: 12px;
      padding: 12px;
      outline: none;
      background: white;
    }

    .measure-map {
      position: relative;
      z-index: 1;
    }

    .leaflet-container {
      font-family:
        Tahoma,
        Arial,
        sans-serif;
    }

    .app-content {
      min-height: 100vh;
    }
  </style>
</head>

<body>

  <div
    id="app"
    class="app-shell"
  >

    <div class="loading-screen">

      <div class="loading-box">

        <div class="spinner"></div>

        <div class="loading-title">
          یار کشاورز
        </div>

        <div class="loading-text">
          در حال آماده‌سازی برنامه...
        </div>

      </div>

    </div>

  </div>


  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =====================================================
       ماژول‌های اصلی برنامه
       ===================================================== -->

  <script src="modules/fun.js"></script>

  <script src="modules/land.js"></script>

  <script src="modules/inventory.js"></script>

  <script src="modules/cultivation.js"></script>

  <script src="modules/weather.js"></script>

  <script src="modules/yar.js"></script>

  <script src="modules/game.js"></script>

  <script src="modules/equipment.js"></script>

  <script src="modules/manager.js"></script>

  <script src="modules/settings.js"></script>

  <script src="modules/backup.js"></script>


  <!-- =====================================================
       صفحات
       ===================================================== -->

  <script src="pages/views.js"></script>


  <!-- =====================================================
       هسته برنامه
       ===================================================== -->

  <script src="modules/app.js"></script>

       ===================================================== -->

  <script src="modules/measurement.js"></script>


  <!-- =====================================================
       سیستم آفلاین
       ===================================================== -->

  <script src="modules/offline-loader.js"></script>

  <script
    src="offline/crop-ui.js?v=20260921-accordion-v1"
  ></script>


</body>
</html>
