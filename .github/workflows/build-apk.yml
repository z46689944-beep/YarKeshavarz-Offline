name: Build YarKeshavarz APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/ir/yarkeshavarz/offline
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets/app

          rsync -a \
            --exclude='.git/' \
            --exclude='android/' \
            ./ android/app/src/main/assets/app/

          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "YarKeshavarzAndroid"
          include(":app")
          EOF

          cat > android/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "ir.yarkeshavarz.offline"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ir.yarkeshavarz.offline"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0-offline"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#0B3D2E</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="یار کشاورز"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/ir/yarkeshavarz/offline/MainActivity.kt <<'EOF'
          package ir.yarkeshavarz.offline

          import android.Manifest
          import android.app.Activity
          import android.os.Bundle
          import android.content.pm.PackageManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebSettings
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : Activity() {

              private lateinit var webView: WebView
              private val locationRequest = 1001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      cacheMode = WebSettings.LOAD_NO_CACHE
                  }

                  webView.webViewClient = WebViewClient()

                  webView.loadUrl("file:///android_asset/app/index.html")

                  requestLocationPermission()
              }

              private fun requestLocationPermission() {
                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          ),
                          locationRequest
                      )
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yarkeshavarz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
